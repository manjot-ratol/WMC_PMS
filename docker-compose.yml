# wmc_pms local stack. `docker compose up -d` = everything (infra + migrate + api + worker + TrackWizz mock) on stubbed partners (Digio and MF Central in WireMock).
# `make up` starts infra only (for running the app from source).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wmc_pms
      POSTGRES_USER: wmc
      POSTGRES_PASSWORD: wmc
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tools/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmc -d wmc_pms"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # host 6380 because a local redis-server already owns 6379 on the dev machine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # minio/minio was withdrawn from public registries; the Bitnami legacy build keeps the MinIO API + console
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_DEFAULT_BUCKETS: pms-documents
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  wiremock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    ports: ["8080:8080"]
    volumes:
      - ./tools/wiremock:/home/wiremock
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  trackwizz-mock:
    image: ${WMC_PMS_IMAGE:-wmc-pms:local}
    build: .
    command: ["mock"]
    environment:
      TRACKWIZZ_MOCK_HOST: 0.0.0.0
      TRACKWIZZ_MOCK_PORT: "8099"
    ports: ["8099:8099"]

  migrate:
    image: ${WMC_PMS_IMAGE:-wmc-pms:local}
    build: .
    command: ["migrate"]
    env_file: ${WMC_PMS_ENV_FILE:-.env.docker}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${WMC_PMS_IMAGE:-wmc-pms:local}
    build: .
    command: ["api"]
    env_file: ${WMC_PMS_ENV_FILE:-.env.docker}
    ports: ["${WMC_PMS_API_PORT:-3000}:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    image: ${WMC_PMS_IMAGE:-wmc-pms:local}
    build: .
    command: ["worker"]
    env_file: ${WMC_PMS_ENV_FILE:-.env.docker}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      trackwizz-mock:
        condition: service_started

volumes:
  pgdata:
  miniodata:
